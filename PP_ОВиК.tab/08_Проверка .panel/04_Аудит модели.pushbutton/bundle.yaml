title: "Аудит\nмодели"
tooltip: >
  Собирает штатные предупреждения Revit по всей модели (doc.GetWarnings) и
  показывает их удобным списком — адаптация встроенного «Просмотр
  предупреждений» под рабочий процесс.

  Что делает:
  Читает все нерешённые предупреждения модели, группирует одинаковые по тексту
  и считает, сколько раз каждое встречается.

  Что выбрать:
  Ничего заранее выделять не нужно — инструмент анализирует всю модель.

  Результат:
  Слева — типы предупреждений, число повторов и время, когда Аудит впервые
  заметил предупреждение. Самые новые находятся сверху. Справа — id связанных
  элементов. Кнопки выделяют проблемные элементы в модели (строку или всю
  группу), есть экспорт списка в CSV и обновление без перезапуска.

  Важно:
  Revit не передаёт фактическое время появления штатных предупреждений.
  Инструмент начинает запоминать время с первого запуска; уже существующие
  предупреждения получат одинаковую начальную отметку.
