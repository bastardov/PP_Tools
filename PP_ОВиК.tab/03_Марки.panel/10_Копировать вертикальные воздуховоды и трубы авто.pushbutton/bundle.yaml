title: "Верт.\nавто"
tooltip: >
  Автоматически копирует эталонную марку на все подходящие вертикальные стояки на активном виде.

  Что выбрать:
  Выберите эталонную марку вертикального воздуховода или трубы.

  Результат:
  Инструмент находит на активном виде вертикальные элементы той же категории и создаёт для них
  марки по образцу эталона.

  Важно:
  Автоматический поиск может захватывать не только нужные стояки, но и похожие вертикальные
  участки, например опуски к решёткам. Перед запуском стоит проверить активный вид.
