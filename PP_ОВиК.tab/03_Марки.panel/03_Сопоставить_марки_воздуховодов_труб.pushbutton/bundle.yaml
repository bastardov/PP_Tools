title: "Сопоставить\n труб и возд."
tooltip: >
  Сопоставляет положение и оформление марки для выбранных труб или воздуховодов.

  Что выбрать:
  Сначала выберите эталонную марку трубы или воздуховода, затем марки, которые нужно обработать.

  Результат:
  Инструмент переносит положение головы, выноску и оформление эталонной марки на остальные
  выбранные марки той же группы.

  Важно:
  Инструмент рассчитан именно на марки труб и воздуховодов, а не на все категории марок подряд.
