title: "Копир.\nпо типу"
tooltip: >
  Создаёт или обновляет марки по эталону для элементов того же типа.

  Что выбрать:
  Выберите эталонную марку.

  Результат:
  Инструмент находит элементы того же типа, что и у эталона, и копирует на них положение
  и оформление марки.

  Важно:
  Поиск выполняется автоматически по типу элемента. Если подходящие элементы не найдены,
  новые марки не создаются.
author: "PP Tools"
