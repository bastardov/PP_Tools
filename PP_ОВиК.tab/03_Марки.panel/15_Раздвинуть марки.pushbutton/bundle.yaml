title: "Раздвинуть\nмарки"
tooltip: >
  Разводит марки, наехавшие друг на друга на активном виде, на минимальное расстояние.

  Что выбрать:
  Откройте план, разрез или фасад и запустите кнопку. Если нужно поправить только один
  узел, выделите его марки заранее — в окне появится режим «Только выделенные», при
  котором остальные марки стоят на местах и работают препятствиями. Есть режим по
  категориям марок и выбор направления: автоматически, только по вертикали или только
  по горизонтали.

  Результат:
  Марки разъезжаются на заданный зазор, головы переставляются одной операцией. Сколько
  марок сдвинется и сколько наложений останется, окно показывает ещё до нажатия кнопки.
  Марки, которым не хватило разрешённого смещения, после работы выделяются в модели.

  Важно:
  Зазор и максимальное смещение задаются в миллиметрах НА ЛИСТЕ — при масштабе 1:100
  зазор 1,5 мм это 150 мм в модели. Закреплённые марки и марки внутри групп не двигаются,
  но учитываются как препятствия. Размеры, текстовые заметки и обозначения инструмент
  препятствиями не считает. Ctrl+Z возвращает всё как было.

  Настройки:
  Параметры окна запоминаются между запусками. Галочки по выноскам определяют, включать ли
  выноску марке, уехавшей дальше заданного порога, и переносить ли изгиб выноски вслед
  за головой.
