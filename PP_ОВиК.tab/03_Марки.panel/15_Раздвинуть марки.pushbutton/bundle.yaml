title: "Раздвинуть\nмарки"
tooltip: >
  Разбирает свалку марок на активном виде: разводит наехавшие друг на друга и распутывает
  перекрестившиеся выноски.

  Что выбрать:
  Откройте план, разрез или фасад и запустите кнопку. Если нужно поправить только один
  узел, выделите его марки заранее — в окне появится режим «Только выделенные», при
  котором остальные марки стоят на местах и работают препятствиями. Есть режим по
  категориям марок и выбор направления: автоматически, только по вертикали или только
  по горизонтали.

  Результат:
  Марки разъезжаются на заданный зазор, головы переставляются одной операцией. Если две
  выноски перекрестились, значит порядок марок не совпадает с порядком их элементов —
  такие марки меняются местами. Марка не встаёт и поверх чужой выноски. Сколько марок
  сдвинется, сколько наложений и пересечений останется, окно показывает ещё до нажатия
  кнопки. Марки, до которых руки не дошли, после работы выделяются в модели.

  Важно:
  Зазор и максимальное смещение задаются в миллиметрах НА ЛИСТЕ — при масштабе 1:100
  зазор 1,5 мм это 150 мм в модели. Окно показывает замеренный габарит марки: если высота
  заметно больше видимого текста, значит в семействе марки есть пустая строка или
  подчёркивание, и они тоже занимают место. Закреплённые марки и марки внутри групп не
  двигаются, но учитываются как препятствия. Размеры и текстовые заметки инструмент
  препятствиями не считает. Ctrl+Z возвращает всё как было.

  Настройки:
  Параметры окна запоминаются между запусками. Галочка «Разбирать пересечения выносок»
  включает перестановку марок местами и обход чужих выносок. Две галочки ниже определяют,
  включать ли выноску марке, уехавшей дальше заданного порога, и переносить ли изгиб
  выноски вслед за головой.
