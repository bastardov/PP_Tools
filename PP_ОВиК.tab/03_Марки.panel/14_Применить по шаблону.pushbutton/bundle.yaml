title: "Применить\nпо шаблону"
tooltip: >
  Применяет шаблон меток и меняет тип уже поставленных марок по правилам из «Шаблон марок».

  Что выбрать:
  Если выделить марки перед запуском, инструмент обработает только выделение и ни о чём не
  спросит. Если ничего не выделено, откроется окно с галочками категорий: снимите те, которые
  трогать не надо, — и будут обработаны марки только отмеченных категорий на активном виде.
  Набор галочек запоминается до следующего запуска.

  Результат:
  Для воздуховодов, труб и изоляции инструмент читает надпись марки, считает её длину в знаках
  и ставит тип марки из активного пресета «По размеру». Для остальных категорий ищет правило
  по семейству или типу элемента. Так на одном виде разом выправляется ширина марок под
  размер элемента.

  Важно:
  Размерное правило важнее правила по семейству и типу. Если для элемента нет ни того, ни
  другого, или нужный тип марки не загружен в проект, инструмент покажет это в отчёте, а марка
  останется без изменений.

  Настройки:
  Пресеты и активный пресет задаются в кнопке «Шаблон марок».
