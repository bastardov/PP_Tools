title: "Верт.\nруч."
tooltip: >
  Копирует эталонную марку на выбранные вертикальные стояки в ручном режиме.

  Что выбрать:
  Сначала выберите эталонную марку вертикального воздуховода или трубы, затем сами вертикальные
  элементы, которым нужно создать марки.

  Результат:
  Инструмент ставит марки по образцу эталона только на выбранные стояки.

  Важно:
  Этот вариант безопаснее автоматического, когда на виде есть лишние вертикальные элементы,
  которые не нужно маркировать.
