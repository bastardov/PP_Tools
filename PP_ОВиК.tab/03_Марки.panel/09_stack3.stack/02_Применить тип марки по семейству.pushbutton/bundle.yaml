title: "по сем."
tooltip: >
  Автоматически меняет тип марок на тип эталона для элементов того же семейства.

  Что выбрать:
  Выберите эталонную марку.

  Результат:
  Инструмент находит марки элементов того же семейства, что и у эталона, и назначает им
  тип эталонной марки.

  Важно:
  Это более широкий вариант, чем применение по типу: затрагиваются все типы внутри семейства.
