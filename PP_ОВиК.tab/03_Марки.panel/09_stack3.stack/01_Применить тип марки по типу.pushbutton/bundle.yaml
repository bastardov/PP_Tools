title: "по типу"
tooltip: >
  Автоматически меняет тип марок на тип эталона для элементов того же типа.

  Что выбрать:
  Выберите эталонную марку.

  Результат:
  Инструмент находит марки элементов того же типа, что и у эталона, и меняет их тип марки
  на тип эталонной марки.

  Важно:
  Положение марок не меняется. Изменяется только их тип.
