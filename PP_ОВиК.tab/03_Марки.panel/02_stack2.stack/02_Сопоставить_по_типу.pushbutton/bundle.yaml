title: "по типу"
tooltip: >
  Автоматически сопоставляет другие марки с эталонной по типу элемента.

  Что выбрать:
  Выберите одну эталонную марку.

  Результат:
  Инструмент находит марки той же категории и того же типа элемента, что у эталона, и
  переносит на них положение и оформление эталонной марки.

  Важно:
  Это более точный вариант, чем сопоставление по семейству: обрабатываются только элементы
  того же типа, что у эталона.
