title: "по сем."
tooltip: >
  Автоматически сопоставляет другие марки с эталонной по семейству элемента.

  Что выбрать:
  Выберите одну эталонную марку.

  Результат:
  Инструмент находит марки той же категории и того же семейства элемента, что у эталона,
  и переносит на них положение и оформление эталонной марки.

  Важно:
  Поиск выполняется автоматически. Если подходящих марок не найдено, изменения не вносятся.
