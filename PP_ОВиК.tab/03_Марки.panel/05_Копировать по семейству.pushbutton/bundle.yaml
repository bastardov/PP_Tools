title: "Копир.\nпо сем."
tooltip: >
  Создаёт или обновляет марки по эталону для элементов того же семейства.

  Что выбрать:
  Выберите эталонную марку.

  Результат:
  Инструмент находит элементы того же семейства, что и у эталона, и переносит на них положение
  и оформление марки.

  Важно:
  Этот вариант охватывает все типы внутри семейства, поэтому обрабатывает шире, чем команда
  «по типу».
