title: "Маркировать\nпо шаблону"
tooltip: >
  Ручная расстановка марок с типом по шаблону меток. Аналог родного «Маркировать
  по категории», но тип марки берётся из правил «Шаблон марок».

  Что выбрать:
  В начале укажите, ставить марки с выноской или без. Затем кликните по элементу, а
  вторым кликом — положение головы марки. Esc на элементе завершает инструмент, Esc на
  точке пропускает текущий элемент.

  Результат:
  Для каждого элемента ищется правило шаблона по семейству/типу и ставится марка нужного
  типа. Если правила нет или тип марки не загружен в проект — ставится марка типом по
  умолчанию для категории, и это показывается в отчёте.

  Важно:
  Работает по категориям шаблона (воздухораспределители, арматура воздуховодов и др.).
  Правила настраиваются в кнопке «Шаблон марок», перетипизировать уже поставленные марки
  можно кнопкой «Применить по шаблону».
