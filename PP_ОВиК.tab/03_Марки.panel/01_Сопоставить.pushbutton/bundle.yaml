title: "Сопоставить\nмарку"
tooltip: >
  Переносит положение и оформление эталонной марки на другие выбранные марки.

  Что выбрать:
  Сначала выберите эталонную марку, затем марки, которые нужно ей сопоставить.

  Результат:
  Инструмент выравнивает выбранные марки по эталону и переносит их оформление.

  Важно:
  Инструмент работает по выбранным маркам и не ищет их автоматически по виду или категории.
