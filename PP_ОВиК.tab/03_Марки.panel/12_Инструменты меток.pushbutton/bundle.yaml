title: "Шаблон\nмарок"
tooltip: >
  Настраивает шаблон меток двумя способами: марка по семейству или типу элемента и марка
  по размеру — для воздуховодов, труб и изоляции.

  Что выбрать:
  Режим «По семейству и типу» — выберите категорию, затем семейство или тип в дереве, а справа
  назначьте нужный тип марки. Режим «По размеру» — выберите пресет слева, а справа задайте
  категорию, длину надписи в знаках и марку, затем нажмите «Добавить строку».

  Результат:
  Инструмент сохраняет правила шаблона, которые потом использует кнопка «Применить по шаблону».

  Важно:
  Правило можно назначить сразу на всё семейство или только на конкретный тип. Длина надписи
  считается по готовому тексту марки: «100х100» — 7 знаков, «1000х1000» — 9. Диапазоны длины
  внутри одной категории не должны пересекаться. Есть экспорт и импорт шаблона для переноса
  настроек.

  Настройки:
  Правила сохраняются в настройках плагина: `tag_rules` — по семейству и типу,
  `tag_size_presets` и `tag_size_active` — по размеру.
