title: "Применить\nтип марки"
tooltip: >
  Меняет тип выбранных марок на тип эталонной марки.

  Что выбрать:
  Сначала выберите эталонную марку, затем остальные марки, которым нужно назначить тот же тип.

  Результат:
  Инструмент не меняет положение марок, а только приводит их тип к типу эталона.

  Важно:
  Команда работает только по выбранным маркам и удобна, когда нужно быстро унифицировать тип
  уже расставленных марок.
