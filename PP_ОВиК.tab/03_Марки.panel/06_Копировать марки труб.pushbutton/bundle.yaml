title: "Копир.\nтруб"
tooltip: >
  Копирует положение и оформление эталонной марки трубы или воздуховода на выбранные элементы.

  Что выбрать:
  Сначала выберите эталонную марку трубы или воздуховода, затем элементы, которым нужно
  создать или обновить марки.

  Результат:
  Инструмент ставит марки на выбранные трубы и воздуховоды по образцу эталона.

  Важно:
  Это ручной инструмент по выбранным элементам. Он не ищет подходящие элементы автоматически.
