title: "Копир.\nпар. труб"
tooltip: >
  Копирует эталонную сдвоенную марку на выбранные пары труб.

  Что выбрать:
  Сначала выберите эталонную сдвоенную марку трубы, затем трубы, которые нужно обработать.

  Результат:
  Инструмент ищет пары труб среди выбранных элементов и ставит на них марки по образцу эталона.

  Важно:
  Пара труб определяется по расстоянию между ними. Если трубы не образуют допустимую пару,
  марка для них не будет создана.

  Настройки:
  Допустимое расстояние для пары труб берётся из панели «Настройки».
