title: "Настройки"
tooltip: >
  Общие настройки плагина: показывать ли отчёты после выполнения, расстояние
  для пары труб, коды правил и типы позиций прокси-контроллера, начала имени
  листа, словари локаций и разделов, параметры переноса данных из пространств
  и передачи параметров по MEP-соединениям.

  Что выбрать:
  Ничего выбирать не нужно, окно открывается сразу.

  Результат:
  Значения сохраняются в файл настроек плагина и действуют для всех
  инструментов, которые их используют. Путь к файлу и кнопка резервной копии
  показаны внизу окна.

  Важно:
  Настройки общие для всего плагина: изменение здесь меняет поведение сразу
  нескольких кнопок с других панелей.
