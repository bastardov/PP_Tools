title: "Между\nперекрытий"
tooltip: >
  Создаёт отдельные 3D виды для пространств между соседними уровнями на основе текущего активного
  3D вида.

  Что выбрать:
  Ничего заранее выбирать не нужно. Перед запуском откройте 3D вид, который будет использоваться
  как исходный шаблон для копирования.

  Результат:
  Инструмент дублирует активный 3D вид для каждой пары соседних уровней и на каждой копии
  настраивает section box между ними с указанными отступами от нижнего и верхнего уровня.

  Важно:
  Инструмент работает только из активного 3D вида и требует минимум два уровня в проекте.
  Если отступы пересекаются между собой, вид для такой пары уровней не создаётся.
