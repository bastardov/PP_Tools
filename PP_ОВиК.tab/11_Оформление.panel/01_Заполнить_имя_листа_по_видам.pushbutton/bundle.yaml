title: "Имя листа\nпо видам"
tooltip: >
  Формирует имя активного листа по обозначениям систем, найденным в именах размещённых на нём видов.

  Что выбрать:
  Ничего заранее выбирать не нужно. Перед запуском откройте нужный лист с размещёнными видами.

  Результат:
  Инструмент находит в именах видов системы вроде В1, Д10 или К2, открывает окно проверки,
  позволяет выбрать нужные системы и записывает итоговую строку в имя листа.

  Важно:
  Инструмент работает только с активного листа. Если на листе нет видов или в их именах не
  найдены поддерживаемые обозначения систем, имя листа не будет заполнено.

  Настройки:
  Начало имени листа берётся из панели «Настройки».
