title: "Полутона"
tooltip: >
  Пакетно ставит галочку «Полутон» выбранным категориям сразу в нескольких
  шаблонах видов — то же, что столбец «Полутон» в диалоге В/Г, но не по одному
  шаблону, а списком.

  Что выбрать:
  Ничего заранее выбирать не нужно. В окне слева отметьте шаблоны видов, к которым
  применить. Справа отметьте категории, которым нужен полутон — по умолчанию уже
  стоят Оси, Марки помещений и Марки пространств (список можно фильтровать поиском).

  Результат:
  Во всех отмеченных шаблонах у отмеченных категорий включается полутон
  (Halftone) через переопределение графики категории.

  Важно:
  Инструмент только ВКЛЮЧАЕТ полутон у отмеченных категорий. Категории, у которых
  галочка снята, не трогаются — их полутон не выключается. Остальные
  переопределения графики (цвет, линии, штриховка) не меняются.
  Выбор запоминается до следующего запуска.
