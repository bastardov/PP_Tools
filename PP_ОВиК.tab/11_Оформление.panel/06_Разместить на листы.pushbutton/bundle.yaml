title: "Разместить\nна листы"
tooltip: >
  Создаёт листы и раскладывает на них виды: планы — каждый на свой лист,
  3D-виды и разрезы — вместе на один.

  Что выбрать:
  В окне выберите режим «Планы» или «Виды», отметьте виды (показываются только
  те, что ещё не лежат на листах), укажите лист-образец, раздел проекта и
  первый номер с суффиксом.

  Результат:
  «Планы» — на каждый план свой лист, план по центру. «Виды» — все отмеченные
  3D-виды, разрезы, фасады и чертёжные виды ложатся рядами на один лист в
  порядке списка: сначала приток (П), потом вытяжка (В), противодымные после
  общеобменных. Имя листа собирается из начала «Схема систем…» и систем в
  именах видов. Основная надпись копируется с образца, формат подбирается через
  «Формат А»: от А3 к А0, затем удлинённые через «Кратность» (кратность 2 не
  используется). Заголовки видов оформляются сразу: тип видового экрана,
  текст «Система П1» из имени вида, положение над или под видом, выравнивание,
  длина линии и заголовки ряда на одной высоте.

  Важно:
  Если виды не поместились даже на самый большой формат, остаток переносится на
  следующий лист со следующим номером — отчёт об этом предупредит. 3D-вид без
  подрезки на листе будет размером со всю модель: такие помечены в списке.
  Масштаб видов не меняется. При тексте «Системы из имени вида» инструмент
  записывает параметр вида «Заголовок на листе».

  Настройки:
  Ориентация листа (альбомная, книжная или подобрать), поля рамки, высота
  штампа и зазор между видами — в окне, запоминаются.
  Начала имени листа и словари для имён планов — в панели «Настройки».
