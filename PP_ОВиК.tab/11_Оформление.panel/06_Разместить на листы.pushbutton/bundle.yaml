title: "Разместить\nна листы"
tooltip: >
  Создаёт по новому листу на каждый отмеченный план и ставит план по центру листа.

  Что выбрать:
  В окне отметьте планы (показываются только те, что ещё не лежат на листах),
  укажите лист-образец, раздел проекта и первый номер с суффиксом.

  Результат:
  Для каждого плана создаётся лист с основной надписью, скопированной с образца.
  Формат подбирается автоматически через параметр «Формат А»: от А3 к А0, затем
  удлинённые через «Кратность» (кратность 2 не используется). План размещается
  по центру рабочей области — рамка минус поля и штамп. Имя листа собирается по
  имени плана так же, как в «Имя листа по планам»; номера берутся подряд,
  занятые пропускаются.

  Важно:
  У основной надписи должен быть параметр «Формат А». Виды, текст и легенды с
  листа-образца не копируются — только рамка. Если план не влез даже на самый
  большой формат, лист всё равно создаётся, а в отчёте будет замечание.
  Масштаб плана не меняется.

  Настройки:
  Поля рамки и высота штампа задаются в окне (блок «Поля рамки и подбор
  формата») и запоминаются. Словари локаций и разделов для имени листа —
  в панели «Настройки».
