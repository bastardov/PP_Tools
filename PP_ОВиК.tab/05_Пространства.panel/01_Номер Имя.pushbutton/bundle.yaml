title: "Номер\nИмя"
tooltip: >
  Маркирует все пространства текущей модели, видимые на активном плане, маркой типа
  «Номер_Наименование» — в один клик, без диалогов.

  Что делает:
  Берёт пространства, видимые на активном виде, пропускает уже помеченные и не
  размещённые, и ставит на остальные марку пространства нужного типа в центре
  пространства.

  Важно:
  Работает только на плане этажа (у вида должен быть уровень) и только со своими
  пространствами — не с пространствами из RVT-связи. Тип марки ищется по имени
  «Номер_Наименование»; если такого типа в проекте нет, будет предложено выбрать из
  загруженных, и выбор запомнится. Кнопку можно запускать повторно — задвоения марок
  не будет.
