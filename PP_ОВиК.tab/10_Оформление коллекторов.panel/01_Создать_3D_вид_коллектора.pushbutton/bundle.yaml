title: "3D вид\nколлекторов"
tooltip: >
  Создаёт отдельные 3D виды для выбранных коллекторов с уже настроенным section box.

  Что выбрать:
  Выберите один или несколько коллекторов в модели.

  Результат:
  Для каждого выбранного элемента создаётся отдельный 3D вид, обрезанный по его габаритам
  с запасом по ширине и высоте.

  Важно:
  Инструмент ориентируется на BoundingBox элемента. Если у выбранного элемента не удаётся
  получить габариты, 3D вид для него не создаётся.
