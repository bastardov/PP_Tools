title: "Разрез\nиз 3D вида"
tooltip: >
  Создаёт разрез по активному 3D виду коллектора с выбранной стороны section box.

  Что выбрать:
  Ничего заранее выбирать не нужно. Перед запуском откройте нужный 3D вид и укажите сторону
  разреза в окне инструмента.

  Результат:
  Инструмент создаёт новый разрез спереди, сзади, слева или справа относительно текущего
  3D вида и его границ.

  Важно:
  Инструмент работает только из активного 3D вида с включённым Section Box. Если тип вида
  «Разрез» отсутствует в проекте, инструмент не сможет создать результат.
