title: "Инфо"
tooltip: >
  Показывает сведения о плагине: разработчика, состав панелей и инструментов,
  версию Revit, версию pyRevit, интерпретатор Python и текущего пользователя.

  Что выбрать:
  Ничего выбирать не нужно, окно открывается сразу.

  Результат:
  Окно со справкой о плагине. Модель не меняется.

  Важно:
  Пригодится, когда нужно быстро назвать версию окружения — например, при
  обсуждении ошибки или несовпадения поведения инструментов у разных людей.
