title: "Номер"
tooltip: >
  Приводит план к маркам помещений типа «Номер» за один клик, без диалогов.

  Что делает:
  Сначала переводит все марки помещений на активном виде (и на помещения связи, и на
  собственные) на тип «Номер». Затем маркирует этим же типом те помещения RVT-связей,
  которые ещё не помечены — на уровне текущего плана и в области подрезки.

  Важно:
  Работает только на плане этажа (у вида должен быть уровень). Тип марки ищется по имени
  «Номер»; если такого типа в проекте нет, будет предложено выбрать из загруженных, и
  выбор запомнится. Чтобы поставить марки с именем помещения, используйте кнопку
  «Марки помещений из связи».
