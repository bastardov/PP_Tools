title: "Номер\nИмя"
tooltip: >
  Ставит марки на все помещения из RVT-связей в один клик, без диалогов выбора
  категории и марки. Аналог родного «Маркировать по категории» с галочкой
  «Включить элементы из связи».

  Что делает:
  Берёт активный план этажа, находит все загруженные и видимые RVT-связи, из каждой
  связанной модели отбирает размещённые помещения на уровне этого плана (и в области
  подрезки, если она включена) и ставит на них марку типом по умолчанию для категории
  «Марки помещений».

  Важно:
  Работает только на плане этажа (у вида должен быть уровень). Уже помеченные на этом
  виде помещения пропускаются, поэтому кнопку можно запускать повторно без задвоения
  марок. Тип марки — назначенный в проекте по умолчанию для категории (например
  «Номер Имя»); сменить его можно в свойствах типа марки помещений.
