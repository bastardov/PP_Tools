title: "Статистика\nиспользования"
tooltip: >
  Показывает, как часто запускаются инструменты плагина: имя инструмента, число запусков
  и дату последнего запуска. Данные берутся из встроенной телеметрии pyRevit.

  Что выбрать:
  Ничего выбирать не нужно. Просто нажмите кнопку — откроется таблица со статистикой по всем
  кнопкам плагина.

  Результат:
  Таблица, отсортированная по числу запусков (сверху — самые популярные инструменты). Видно
  первый и последний запуск каждого инструмента и общее число запусков. Есть кнопка «Экспорт
  в CSV» для выгрузки и анализа в Excel.

  Важно:
  Логирование ведёт pyRevit, поэтому учитываются запуски только с того момента, как включена
  телеметрия. Если телеметрия ещё не включена, кнопка предложит включить её автоматически —
  после этого нужно перезапустить Revit, и запуски начнут записываться. Записи до включения
  телеметрии отсутствуют.

  Настройки:
  Папку с логами телеметрии задаёт сам pyRevit (Settings → Telemetry). Кнопка показывает
  текущий путь к папке внизу окна.
