title: "Передача\nпо MEP\nсвязям"
tooltip: >
  Копирует значение параметра из подключенных MEP-источников в приемники.

  Что выбрать:
  В окне инструмента отметьте категории источника и приемника, выберите параметры кнопками «Выбрать…» или введите их имена вручную, затем задайте область обработки: вся модель, текущий вид, источник вручную или приемник вручную.

  Результат:
  В режиме всей модели инструмент проходит по всем приемникам выбранных категорий. При ручном выборе источника он обрабатывает только подключенные к выбранным источникам приемники выбранных категорий. При ручном выборе приемника он обрабатывает только выбранные приемники.

  Важно:
  В списке источника доступны параметры проекта экземпляра и типа, а в списке приемника — только параметры экземпляра. Ручной ввод можно использовать для встроенных и семейных параметров. При ручном выборе элементов доступны только выбранные категории. Последние имена параметров и режим сохраняются для следующего запуска.

  Заполнять разрывы по цепочке:
  Отдельный режим (галочка). Строит граф связей по MEP-коннекторам среди объединения выбранных категорий (источник + приемник) по всей модели и заливает цепочки пустых элементов значением из параметра приемника, если с обеих сторон разрыв граничит с одним и тем же значением. Если по краям разные значения — разрыв помечается как конфликт и не заполняется. В этом режиме режим обработки и фильтр не учитываются.
