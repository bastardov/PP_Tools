title: "Соединить\nпод углом"
tooltip: >
  Соединяет два прямых горизонтальных элемента на разных высотах наклонным участком под заданным углом.

  Что выбрать:
  Выберите два элемента одного типа: трубу с трубой или воздуховод с воздуховодом.

  Результат:
  Инструмент достраивает нижний элемент, создаёт наклонный соединительный участок и по возможности
  ставит необходимые отводы.

  Важно:
  Оба элемента должны быть прямыми, горизонтальными и параллельными в плане. Если угол или
  расстояние между элементами не позволяют построить участок, инструмент покажет предупреждение.
