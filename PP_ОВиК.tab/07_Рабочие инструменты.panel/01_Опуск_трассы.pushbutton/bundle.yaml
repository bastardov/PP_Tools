title: "Опуск\nподъем\nуглы"
tooltip: >
  Создаёт опуск или подъём выбранной трубы либо воздуховода на заданную величину и под нужным углом.

  Что выбрать:
  Выберите трубу или воздуховод, затем укажите точку разрыва и точку направления на этом же элементе.

  Результат:
  Инструмент разрывает трассу в указанном месте, создаёт новые участки с опуском или подъёмом,
  а также восстанавливает соединения со связанными элементами, где это возможно.

  Важно:
  Инструмент рассчитан на прямые участки труб и воздуховодов. Перед запуском в окне нужно
  задать направление, величину смещения и угол.
