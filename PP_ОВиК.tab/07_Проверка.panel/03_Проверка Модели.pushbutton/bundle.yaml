title: "Модель"
tooltip: >
  Набор проверок модели (по образцу «Проверки спецификации»), но со своими
  правилами. Проверки отмечаются галочками в окне инструмента.

  Что выбрать:
  Перед запуском отметьте нужные проверки и при необходимости уточните их
  параметры в панели справа.

  Проверка 1. Трубы без расхода:
  Ищет трубы с пустым или нулевым расходом. Параметр расхода настраивается
  (пусто = встроенный «Расход» Revit), можно ограничить или исключить системы
  по маскам имён. Трубы без назначенной системы помечаются отдельно.

  Проверка 2. Уклон у труб и воздуховодов:
  Показывает элементы, у которых в параметре «Уклон» есть значение, кроме
  перечисленных в поле исключений. По умолчанию пропускаются 0; 100; 57.7350;
  173.2051 — то есть нулевой уклон и штатные диагонали 45°, 30°, 60°.

  Проверка 3. Элементы без системы (висящие):
  Находит клапаны, краны, фитинги, оборудование и т.п. выбранных категорий,
  у которых есть MEP-коннекторы, но ни один не подключён — элемент «висит» и
  не входит ни в одну систему. Опция «частично подключённые» добавляет в отчёт
  элементы с частью свободных концов.

  Проверка 4. Почти соединённые концы:
  Ищет пары свободных концов труб и воздуховодов ближе заданного допуска
  (по умолчанию 50 мм), которые визуально примыкают, но не соединены —
  типовой «забыл дотянуть».

  Проверка 5. Короткие обрезки:
  Трубы и воздуховоды короче порога (по умолчанию 100 мм) — мусор от
  редактирования, засоряющий спецификацию. Порог и категории настраиваются.

  Проверка 6. Вырожденная геометрия:
  Трубы и воздуховоды с длиной ≈ 0 (по умолчанию ≤ 1 мм) — невидимые
  ошибочные элементы, которые нужно удалить.

  Проверка 7. Дубли в одной точке:
  Наложенные элементы одной категории: оборудование, арматура, фитинги — по
  точке вставки; трубы и воздуховоды — по совпадению обоих концов. Допуск и
  «только одинаковый типоразмер» настраиваются.

  Результат:
  Отчёт по каждой проверке с числом найденных проблем. Из отчёта можно выделить
  проблемные элементы в модели и подкрасить их красным на текущем виде.
