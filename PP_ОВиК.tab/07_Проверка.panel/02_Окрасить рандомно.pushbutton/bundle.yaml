title: "Окрасить\nрандомно"
tooltip: >
  Окрашивает элементы на активном виде случайными цветами по значению выбранного параметра.

  Что выбрать:
  Ничего заранее выбирать не нужно. После запуска отметьте нужные категории (список берётся
  с активного вида) и укажите параметр группировки (по умолчанию ADSK_Группирование).

  Результат:
  Все элементы с одинаковым значением параметра получают один случайный цвет. Разные значения —
  разные цвета. Так визуально видно, всё ли в одной системе окрашено одинаково или есть ошибка.

  Пример:
  На 3D-виде только вентиляция — выбираете «Воздуховоды», «Соединители воздуховодов» и параметр
  ADSK_Группирование. Каждая система красится своим цветом.

  Важно:
  Работает только с элементами, видимыми на активном виде. Элементы без значения параметра
  получают сброс окрашивания (видно, что они выпали из группировки). Есть режим «Только сбросить».
