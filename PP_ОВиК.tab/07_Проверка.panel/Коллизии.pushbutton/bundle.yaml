title: "Коллизии"
tooltip: >
  Проверяет коллизии инженерных элементов на активном виде и окрашивает найденные пересечения.

  Что выбрать:
  Ничего заранее выбирать не нужно. Инструмент сам анализирует элементы на активном виде.

  Результат:
  Все найденные элементы вентиляции и труб окрашиваются в серый цвет. Элементы в коллизии
  подсвечиваются попарно: один красным, второй фиолетовым.

  Важно:
  Инструмент работает только в пределах активного вида. Перед запуском можно выбрать
  сброс текущего окрашивания и при необходимости включить фасонные детали в проверку.
