title: "Спецификации"
tooltip: >
  Запускает набор независимых проверок спецификации по трубам, воздуховодам,
  прокси-позициям и связанным категориям.

  Что выбрать:
  Перед запуском отметьте нужные проверки в окне инструмента и при необходимости
  уточните имена параметров, текст поиска, список стандартных размеров меди и
  семейство прокси.

  Результат:
  Инструмент формирует отчет по каждой проверке, показывает количество
  найденных проблем и позволяет выделить проблемные элементы прямо из отчета.

  Важно:
  Первая версия проверяет весь проект, а не только активный вид. Проверка связи
  прокси и исходных элементов работает по параметру PP_GUID.
