title: "Имя листа\nпо планам"
tooltip: >
  Пакетно заполняет имя листа по именам видов, размещённых на выбранных листах.

  Что выбрать:
  После запуска выберите листы, которые нужно переименовать.

  Результат:
  Инструмент анализирует имена видов на каждом листе, предлагает новое имя в таблице
  «было / станет» и позволяет вручную проверить или поправить результат перед записью.

  Важно:
  Если на листе несколько видов, разные разделы или не распознана локация, инструмент
  покажет это в примечании. Если итоговое имя уже занято, будет автоматически подобрано
  уникальное имя.

  Настройки:
  Словари локаций и разделов берутся из панели «Настройки».
