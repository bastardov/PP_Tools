title: "Связи\nв шаблоне"
tooltip: >
  Пакетно задаёт видимость связанных файлов RVT — то же, что вкладка
  «Связанные файлы RVT» в диалоге В/Г, но сразу для многих шаблонов или видов.

  Что выбрать:
  Ничего заранее выбирать не нужно. В окне слева отметьте, к чему применять:
  вкладка «Шаблоны видов» или вкладка «Виды» (есть строка поиска и кнопка
  «Текущий вид» — для видов без шаблона). Справа галочками задайте состояние
  связей: галочка стоит — связь видна, галочка снята — связь выключается.

  Результат:
  Во всех отмеченных шаблонах и видах видимость связей приводится к состоянию,
  заданному справа. Связь выключается целиком — снимается галочка и у самого
  файла связи, и у всех его экземпляров. Кнопка «Как в текущем виде»
  подтягивает фактическое состояние связей активного вида как отправную точку.

  Важно:
  Спецификации, листы и легенды в списки не попадают.
  Если у вида назначен шаблон, управляющий связями, шаблон перебьёт изменения —
  такие виды перечисляются в отчёте.
  Остальные настройки связей и переопределения графики не трогаются.
  Выбор запоминается до следующего запуска.
