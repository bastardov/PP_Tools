title: "Опуск подъём\nэлементов"
tooltip: >
  Перемещает выбранные MEP-элементы одной группой вверх, вниз или на заданную отметку.

  Что выбрать:
  До запуска выделите трубы, воздуховоды, фитинги, арматуру, оборудование, решётки
  и другие поддерживаемые элементы. Если ничего не выделено, инструмент предложит
  выбрать элементы после запуска.

  Результат:
  Вся выборка сдвигается по вертикали на одну величину. В режиме «На отметку» можно
  задать уровень, отметку от него и привязку по опорной точке, низу или верху группы.
  Взаимное положение выбранных элементов сохраняется.

  Важно:
  Закреплённые элементы и элементы внутри групп не перемещаются. Если у выборки есть
  соединения с элементами снаружи, Revit может перестроить соседние участки или
  отказаться от операции — выбирайте связанную ветку целиком.
