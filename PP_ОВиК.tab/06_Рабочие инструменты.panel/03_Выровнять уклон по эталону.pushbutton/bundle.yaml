title: "Выровнять\nуклон"
tooltip: >
  Приводит выбранные трубы к одной высоте — убирает уклон и выравнивает систему
  в горизонтальной плоскости.

  Что выбрать:
  Сначала укажите одну трубу-эталон (с нужной высотой), затем выберите трубы,
  которые нужно выровнять по ней.

  Как работает:
  Целевая отметка берётся по коннектору эталона. Каждая выбранная труба
  перестраивается в строго горизонтальный отрезок на этой отметке, а фитинги
  между трубами временно отсоединяются, сдвигаются на нужную высоту и
  подключаются обратно, чтобы соединения сохранились.

  Важно:
  Первая версия работает только с трубами. Фитинги, у которых есть связь наружу
  выборки (например отвод-опуск к стояку), не двигаются — они показываются в
  отчёте для ручной доводки. Предупреждения Revit гасятся, подробности пишутся
  в _logs/flatten_slope.log.
