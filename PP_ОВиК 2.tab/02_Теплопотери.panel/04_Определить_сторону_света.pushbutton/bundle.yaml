title: "Опр. стор.\nсвета"
tooltip: >
  Определяет сторону света для выбранных элементов и записывает только параметры ориентации.

  Что выбрать:
  Выберите стены, витражи, окна, двери и перекрытия, для которых нужно определить сторону света.

  Результат:
  Инструмент записывает значения в параметры `PP_Ориентация по стороне света` и
  `PP_Добавка на сторону света`, не меняя остальные данные элемента.

  Важно:
  Инструмент не переносит температуру, номер помещения и другие параметры. Для горизонтальных
  перекрытий сторона света не определяется и записывается нейтральный результат.
