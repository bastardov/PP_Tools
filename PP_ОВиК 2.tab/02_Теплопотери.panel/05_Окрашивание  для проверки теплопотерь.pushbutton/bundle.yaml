title: "Окрашивание\nдля проверки"
tooltip: >
  Окрашивает элементы на активном виде по принадлежности к одному пространству для проверки переноса данных.

  Что выбрать:
  Ничего заранее выбирать не нужно. После запуска отметьте категории, которые нужно окрасить.

  Результат:
  Стены, окна, двери и перекрытия, относящиеся к одному пространству, получают одинаковый
  случайный цвет, чтобы было видно корректность группировки.

  Важно:
  Инструмент работает только с элементами, видимыми на активном виде. Если элементы выбранных
  категорий на виде не найдены, окрашивание не выполняется.
