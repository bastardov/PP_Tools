title: "Перенос\nданных"
tooltip: >
  Переносит данные из пространств в выбранные стены, витражи, окна, двери и перекрытия.

  Что выбрать:
  Выберите элементы, в которые нужно записать данные из пространств.

  Результат:
  Инструмент ищет связанное пространство для каждого элемента и записывает в параметры
  нужные данные, включая имя, номер, температуру и другие значения для расчёта.

  Важно:
  Если пространство не найдено или геометрия элемента читается неоднозначно, элемент может
  быть пропущен или попасть в предупреждения отчёта.

  Настройки:
  Определение стороны света при переносе зависит от параметров панели «Настройки».
