title: "Кровля"
tooltip: >
  Создаёт верхние плиты или кровлю по контурам выбранных MEP-пространств.

  Что выбрать:
  Выберите MEP-пространства, по которым нужно создать верхние перекрытия.

  Результат:
  Инструмент считывает границы пространств и формирует для них верхние плиты или кровельные
  элементы на подходящем уровне.

  Важно:
  Для корректной работы у пространств должны быть доступны границы и уровень привязки.
  Если подходящую геометрию определить нельзя, такие элементы будут пропущены.
