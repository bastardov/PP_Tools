title: "Заполнить\nплиту"
tooltip: >
  Убирает из контура плиты вырезы под колонны: плита, нарезанная по пространствам,
  становится ровной, без «зубцов» вокруг колонн.

  Что выбрать:
  Выделите полы или кровли, у которых надо выправить контур. Без выделения инструмент
  попросит выбрать их мышью. Обычно это плиты, созданные кнопками «Полы» и «Кровля»
  этой же панели.

  Результат:
  В контуре заполняются выемки, в которых стоит колонна, и мелкие выемки меньше заданного
  размера. Соседнее ребро контура продлевается, вырез в углу закрывается сведением рёбер
  в угол. Отдельной галочкой заполняются и отверстия внутри плиты. Плита остаётся той же:
  id, тип, параметры, марки и размеры сохраняются, правится только эскиз контура.

  Важно:
  Колонны ищутся в модели и в RVT-связях, по габариту в плане и по отметке. Вырез
  заполняется, только если он не больше самой колонны — настоящий уступ плиты
  инструмент не тронет. Дуги в контуре не трогаются. Кровля выдавливанием пропускается:
  у неё нет контура-эскиза. Отмена — Ctrl+Z.
