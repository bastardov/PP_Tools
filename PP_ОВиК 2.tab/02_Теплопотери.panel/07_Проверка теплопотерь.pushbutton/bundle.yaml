title: "Проверка\nтеплопотерь"
tooltip: >
  Проверяет, что данные на строительных элементах совпадают с пространствами рядом.

  Проверка №1 «Имя и номер помещения»:
  Сверяет параметр «PP_Номер имя помещения» на стенах, витражах, окнах, дверях и
  перекрытиях со значением пространства рядом. Пространство ищется тем же алгоритмом,
  что и в «Переносе данных из пространств», поэтому эталон совпадает с тем, что перенос
  записал бы сейчас.

  Зачем:
  Архитектор переименовал или перенумеровал помещение, вы обновили пространства родным
  инструментом Revit — а на стенах и проёмах осталось старое имя. Проверка показывает,
  где именно.

  Что выбрать:
  Ничего не обязательно. Область проверки задаётся в окне: вся модель или текущее
  выделение. Выделение работает заметно быстрее.

  Результат:
  Окно отчёта: расхождения, пустые параметры, ненайденные пространства — по отдельным
  строкам. Проблемные элементы можно выделить в модели и подкрасить на текущем виде.

  Важно:
  Инструмент только читает модель и ничего не записывает. Исправление — запуском
  «Переноса данных из пространств» на отобранных элементах.
