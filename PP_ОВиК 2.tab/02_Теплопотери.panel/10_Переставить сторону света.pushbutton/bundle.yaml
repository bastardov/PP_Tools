title: "Переставить\nстор. света"
tooltip: >
  Сдвигает уже записанные стороны света по кругу — на случай, когда здание
  развернули и все значения разом стали неверными.

  Что выбрать:
  Ничего выбирать не нужно. Откройте 3D вид, на котором видно то, что нужно
  переставить: инструмент берёт стены, витражи, окна и двери именно этого вида
  (разрезающая рамка и фильтры вида учитываются).

  Результат:
  В окне два компаса: слева — как записано сейчас, с числом элементов у каждой
  стороны, справа — как станет. Поверните правый компас на тот же угол, на
  который повернули здание, и нажмите «Переставить». Значения параметра
  `PP_Ориентация по стороне света` сдвинутся по часовой стрелке с шагом 45°:
  при повороте на 90° С станет В, СВ — ЮВ и так далее.

  Важно:
  Инструмент ничего не вычисляет заново и не смотрит на геометрию — он только
  переписывает готовые значения. Годится, когда повернули здание целиком; если
  двигали отдельные стены, пользуйтесь кнопкой «Опр. стор. света».
  Параметр `PP_Добавка на сторону света` по умолчанию не трогается — включите
  галочку в окне, если добавку нужно пересчитать под новую сторону.
  Отмена — Ctrl+Z.
