title: "тип\nстен"
tooltip: >
  Окрашивает стены по значению параметра `Rст` для проверки типов и расчётных данных.

  Что выбрать:
  Ничего заранее выбирать не нужно.

  Результат:
  Стены с одинаковым значением параметра `Rст` получают одинаковый цвет, что помогает быстро
  увидеть одинаковые и отличающиеся группы.

  Важно:
  Инструмент работает только со стенами, видимыми на активном виде. Если параметр `Rст`
  заполнен непоследовательно, это сразу проявится в раскраске.
