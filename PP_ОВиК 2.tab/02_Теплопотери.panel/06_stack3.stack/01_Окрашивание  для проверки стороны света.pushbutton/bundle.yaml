title: "стор.\nсвет"
tooltip: >
  Окрашивает элементы на активном виде по сторонам света для визуальной проверки ориентации.

  Что выбрать:
  Ничего заранее выбирать не нужно.

  Результат:
  Стены, окна, двери и перекрытия с одинаковой стороной света получают один цвет, чтобы можно
  было быстро проверить корректность записанной ориентации.

  Важно:
  Инструмент работает только по элементам, которые видны на активном виде и уже имеют данные
  по стороне света.
