title: "задвоение"
tooltip: >
  Ищет задвоенные элементы на активном виде и подсвечивает найденные пары разными цветами.

  Что выбрать:
  Ничего заранее выбирать не нужно. Перед запуском можно выбрать сброс текущего окрашивания.

  Результат:
  Инструмент проверяет окна, двери, перекрытия и стены, которые почти полностью совпадают
  по объёму, и окрашивает каждую найденную пару в красный и фиолетовый цвет.

  Важно:
  Инструмент работает в пределах активного вида. Если включён режим сброса, текущее окрашивание
  на виде будет очищено без повторного поиска.
