title: "Объединить\nстены"
tooltip: >
  Собирает куски одной стены в одну стену, чтобы в расчёте теплопотерь была одна позиция
  вместо нескольких.

  Что выбрать:
  Выделите куски, которые архитектор нарисовал отдельно: простенок и перемычку над проёмом,
  сегменты стены в ряд. Куски должны лежать в одной плоскости и касаться друг друга. Уже
  объединённые стены можно объединять дальше — так набирается вся стена по фасаду. Без
  выделения инструмент попросит выбрать стены мышью.

  Результат:
  Вместо выбранных кусков создаётся одна стена по их общему контуру, исходные удаляются.
  Пользовательские параметры (PP_, ADSK_ и другие параметры проекта), фаза и рабочий набор
  переносятся с самого большого куска. Тип объединённой стены выбирается в окне: своим
  именем или «Автоматически» — тип самого большого куска.

  Важно:
  Стены с окнами и дверями объединяются только по галочке «Переносить проёмы»: Revit не умеет
  менять окну хост, поэтому они вставляются в новую стену заново и получают новые id —
  параметры проекта, марка, фаза и рабочий набор переносятся, а марки-выноски на видах и
  размеры по этим окнам пропадут. Стены с нишами и вырезами не объединяются вовсе.
  Также пропускаются витражи, составные стены, стены в группах, дуговые, с наклонным или
  скруглённым профилем и привязанные верхом или низом к другому элементу — причина по каждой
  стене пишется в окне и в отчёте. Низ и верх каждого куска берутся с его реальной геометрии,
  а не из параметров: у перемычки с изменённым профилем они не совпадают. Высота готовой
  стены сверяется с расчётным контуром, и при расхождении набор откатывается. Объединённая
  стена встаёт по средней плоскости исходной. Отмена — Ctrl+Z.
