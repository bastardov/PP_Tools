title: "Полы"
tooltip: >
  Создаёт полы по контурам выбранных MEP-пространств.

  Что выбрать:
  Выберите MEP-пространства, по которым нужно создать полы.

  Результат:
  Инструмент считывает границы пространств и создаёт для них новые полы на соответствующих
  уровнях проекта.

  Важно:
  Для корректной работы у пространств должны читаться границы. Если часть пространств
  обработать нельзя, они будут пропущены.
