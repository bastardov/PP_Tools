title: "Длина\nкоридора"
tooltip: >
  Рассчитывает длину коридора по выбранным помещениям или пространствам и показывает
  на виде линии, по которым выполнен расчёт.

  Что выбрать:
  Сначала откроется окно с галочками — откуда брать помещения: из текущего файла,
  из RVT-связи (нужно в шаблоне ОВ, где помещения приходят из связи АР), или сразу
  из обоих. Затем на виде выбираются сами помещения — по одному проходу на каждый
  отмеченный источник. Выбор на виде завершается кнопкой «Готово» в панели
  параметров, Esc отменяет инструмент.

  Результат:
  Инструмент объединяет выбранные контуры в одну фигуру, определяет осевые отрезки
  коридора, показывает подробный отчёт и рисует линии детализации для визуальной проверки.

  Важно:
  Инструмент нужно запускать только на плоском виде. Если выбранные элементы не образуют
  один связный коридор, результат может быть некорректным. Линии создаются в модели и их
  можно удалить или отменить.
