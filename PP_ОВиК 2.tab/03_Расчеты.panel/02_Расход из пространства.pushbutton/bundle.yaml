title: "Расход из\nпространства"
tooltip: >
  Раскладывает расчётный расход пространства поровну по вентиляционным решёткам,
  которые стоят внутри него.

  Что выбрать:
  Выделите пространства до запуска — инструмент возьмёт выделение. Если ничего
  не выделено, после кнопки «Далее» пространства выбираются на виде, выбор
  завершается кнопкой «Готово» в панели параметров, Esc отменяет инструмент.

  Результат:
  Для каждого пространства инструмент находит воздухораспределители внутри него,
  делит «ADSK_Расчетная вытяжка» на число вытяжных решёток и «ADSK_Расчетный приток»
  на число приточных, записывает долю в «ADSK_Расход воздуха» каждой решётки и
  проставляет пространству количество решёток. В конце показывает отчёт по каждому
  пространству.

  Важно:
  Вытяжной или приточной решётка считается по имени системы: вытяжка — В, ВЕ,
  приток — П, ПЕ. Системы противодымной вентиляции (ДУ, ПД, подпор) пропускаются,
  их расход не трогается. Решётка без системы или с чужой системой попадает в
  отчёт и остаётся без изменений.

  Настройки:
  Имена параметров, префиксы систем и список исключений задаются в окне перед
  запуском и запоминаются до следующего раза.
