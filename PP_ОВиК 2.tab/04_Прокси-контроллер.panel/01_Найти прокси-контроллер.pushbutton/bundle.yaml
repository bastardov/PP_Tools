title: "Найти\nконтроллер"
tooltip: >
  Находит в проекте прокси-контроллер семейства PP и выделяет его в модели.

  Что выбрать:
  Ничего заранее выбирать не нужно.

  Результат:
  Инструмент ищет семейство контроллера в проекте, выделяет найденный экземпляр и по возможности
  переводит вид к нему. Если контроллеров несколько, сначала предлагает выбрать нужный из списка.

  Важно:
  Инструмент работает только с семейством контроллера, принятым в этом плагине. Если семейство
  отсутствует в проекте, контроллер найден не будет.
