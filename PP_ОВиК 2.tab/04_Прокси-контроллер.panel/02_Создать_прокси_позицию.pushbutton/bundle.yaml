title: "Прокси\nпозиция"
tooltip: >
  Создаёт прокси-позицию для специфицирования немоделируемых элементов через контроллер.

  Что выбрать:
  Ничего заранее выбирать не нужно. После запуска заполните параметры позиции в окне инструмента.

  Результат:
  Инструмент находит контроллер, создаёт экземпляр семейства прокси-позиции рядом с ним и
  заполняет основные параметры: марку, наименование, количество, код правила и тип позиции.

  Важно:
  В проекте должны быть загружены семейства контроллера и прокси-позиции. Если контроллеров
  несколько, инструмент предложит выбрать нужный.

  Настройки:
  Списки кодов правил и типов позиции берутся из панели «Настройки».
