title: "Выгрузить"
tooltip: >
  Собирает всю модель в один JSON-файл для анализа ИИ-агентом расчёта теплопотерь.

  Что выбрать:
  Ничего выделять не нужно — инструмент сам собирает все пространства и ограждающие
  конструкции проекта (стены, витражи, окна, двери, перекрытия).

  Результат:
  Файл AI_обмен\model_export.json рядом с плагином. В нём геометрия (координаты, габариты,
  нормали стен, контуры пространств), связи (окно/дверь → стена-хозяин) и текущие значения
  параметров теплопотерь: температура, номер и имя помещения, площадь, сторона света и добавка.

  Важно:
  Для корректного поиска пространств в проекте должен быть включён расчёт объёмов.
  Инструмент только читает модель и ничего в ней не меняет. Координаты выгружаются в мм,
  площади в м².
