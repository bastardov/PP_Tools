title: "Загрузить"
tooltip: >
  Применяет к модели команды ИИ-агента: записывает значения параметров в элементы по их id.

  Что выбрать:
  Ничего выделять не нужно. Инструмент читает файл AI_обмен\commands.json рядом с плагином;
  если его нет — предложит выбрать файл вручную.

  Результат:
  Для каждого элемента из файла записываются указанные параметры (назначение помещения,
  температура, сторона света и добавка, площадь или любые другие). Всё пишется одной
  транзакцией, затем показывается отчёт: записано, пропущено, ошибки.

  Важно:
  Значения в файле задаются так, как они выглядят в интерфейсе Revit (например «20 °C»,
  «1.1», «С»). Пишутся только параметры экземпляра; параметры только для чтения
  пропускаются. Остальные параметры элементов не трогаются.
