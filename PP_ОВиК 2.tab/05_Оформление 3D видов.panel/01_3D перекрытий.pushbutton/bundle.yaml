title: "пере\nкрытий"
tooltip: >
  Создаёт отдельные 3D виды по каждому уровню на основе текущего активного 3D вида.

  Что выбрать:
  Ничего заранее выбирать не нужно. Перед запуском откройте 3D вид, который будет использоваться
  как исходный шаблон для копирования.

  Результат:
  Инструмент дублирует активный 3D вид для каждого уровня проекта и на каждой копии настраивает
  section box по высоте уровня с указанными верхним и нижним отступами.

  Важно:
  Инструмент работает только из активного 3D вида. Перед созданием нужно задать числовые
  отступы сверху и снизу в миллиметрах.
